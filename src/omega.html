<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#02060D">
  <title>Omega · DVR</title>
  <link rel="icon" href="assets/img/logo-192.png">
  <link rel="stylesheet" href="css/omega.css">
</head>
<body>
  <div class="om om-notice"><div><h1>OMEGA</h1></div></div>

  <!-- Scripts clássicos (sem módulos ES). Em TV (ou com ?tv=1, para testar no computador) vai para omega-tv.html, que não carrega
       o three.js; nos outros aparelhos carrega a cena 3D. -->
  <script src="js/core/compat.js"></script>
  <script>
    (function () {
      if (window.CD.compat.detected() || /[?&]tv=1(&|$)/.test(location.search)) { location.replace('omega-tv.html'); return; }
      ['config/settings.example.js', 'config/settings.js', 'js/core/i18n.js', 'js/i18n/pt.js', 'js/i18n/en.js', 'js/i18n/es.js', 'js/i18n/zh.js', 'js/i18n/srv.js',
        'js/core/util.js', 'js/core/icons.js', 'js/services/hubApi.js', 'js/services/calendar.js', 'js/services/trafficApi.js', 'js/services/cameraPlayer.js',
        'vendor/three/three.min.js', 'js/omega/scene.js', 'js/omega/voice.js', 'js/omega/omega.js'].forEach(function (s) {
        document.write('<script src="' + s + '"' + (s === 'config/settings.js' ? ' onerror="void 0"' : '') + '><\/script>');   // settings.js é opcional
      });
    })();
  </script>
</body>
</html>
